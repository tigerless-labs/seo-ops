# AI 爬虫 UA 清单(要求的组成部分;robots.txt 生成与 checker C1 判定的唯一数据源)
# 收录判据:**拦了会损失可见性的 UA**。拦了不损失什么的,不进清单(见文末「核过但不收」)。
# 新爬虫 → 改本文件走 PR,依据各厂官方爬虫文档(checklist 权威依据表);聚合类文章只当线索,不作依据。
#
# 2026-08-24 校验:补 ClaudeBot(Anthropic 训练)、Bytespider(字节训练)、Meta-ExternalFetcher(Meta 用户代取)
# 2026-08-25 校验:新增 search_classic 组 —— 经典搜索爬虫本身已是 AI 通道,
#            此前不在清单里,意味着 C1 查不出「Googlebot 被 Disallow」这种最严重的事故。
crawlers:
  search_classic:  # 经典搜索爬虫 —— 同时是 AI 通道,拦了是全站级事故
    - Googlebot      # Google 官方:覆盖 Search 及**所有 Search 功能** → AI Overviews / AI Mode 均在内
    - Bingbot        # ChatGPT search 走 Bing 索引 → 这条是 GEO 依赖,不只是 Bing 流量
  training:        # 训练爬虫:抓去进训练集
    - GPTBot
    - ClaudeBot
    - Google-Extended      # ⚠ 纯 robots.txt opt-out token,背后无实际爬虫(日志里查不到它)
    - Applebot-Extended    # ⚠ 同上:只是 Apple Intelligence 训练的开关
    - CCBot
    - Meta-ExternalAgent
    - Amazonbot
    - Bytespider           # 已知部分不遵守 robots.txt
  search:          # 检索爬虫:建实时搜索索引,对被引用最关键
    - OAI-SearchBot
    - Claude-SearchBot
    - PerplexityBot
    - DuckAssistBot
  user_fetch:      # 用户代取:对话中点开链接实时抓取(部分不完全遵守 robots.txt)
    - ChatGPT-User
    - Claude-User
    - Perplexity-User
    - Meta-ExternalFetcher
policy: allow      # 全放行(获客型站点)

# ── 核过但不收 ────────────────────────────────────────────────
# GoogleOther —— Google 官方文档明写「generic crawler,**no specific product impact**」,
#   拦了不损失任何产品。聚合文章把它列为 tier-2 建议放行,与厂商文档冲突;以厂商为准,不收。
#   (GoogleOther-Image / -Video / Google-CloudVertexBot / Storebot-Google 同理,产品面不相关。)
# YouBot · iaskspider · Diffbot · omgilibot · img2dataset —— 长尾 AI 搜索与数据聚合。
#   policy 是 allow,漏一个的代价≈0(不在清单里的 UA 本来也不会被特意拦);
#   而每收一条就多一条要跟着厂商文档维护的东西。回报对不上,不收。
#
# ── 待核(有线索,未见官方文档确认,确认后再合)──────────────
# FacebookBot(Meta,与 Meta-ExternalAgent 是两个)· anthropic-ai(Anthropic 旧 UA)· cohere-ai
