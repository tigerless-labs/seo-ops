# AI crawler UA roster (part of the requirements; the sole data source for robots.txt generation and the checker's C1 verdict)
# Inclusion criterion: **UAs that cost visibility if blocked**. UAs whose blocking costs nothing stay out (see "Vetted but not included" at the end).
# New crawler → edit this file via PR, based on each vendor's official crawler docs (the checklist's authoritative-references table); aggregator articles are leads only, never the basis.
#
# 2026-08-24 review: added ClaudeBot (Anthropic training), Bytespider (ByteDance training), Meta-ExternalFetcher (Meta user fetch)
# 2026-08-25 review: added the search_classic group — classic search crawlers are themselves an AI channel;
#            they weren't in the roster before, meaning C1 couldn't catch "Googlebot is Disallowed", the worst possible incident.
crawlers:
  search_classic:  # classic search crawlers — also AI channels; blocking one is a site-wide incident
    - Googlebot      # Google official: covers Search and **all Search features** → AI Overviews / AI Mode included
    - Bingbot        # ChatGPT search runs on the Bing index → this is a GEO dependency, not just Bing traffic
  training:        # training crawlers: fetch pages into training sets
    - GPTBot
    - ClaudeBot
    - Google-Extended      # ⚠ pure robots.txt opt-out token, no actual crawler behind it (never shows up in logs)
    - Applebot-Extended    # ⚠ same: just the switch for Apple Intelligence training
    - CCBot
    - Meta-ExternalAgent
    - Amazonbot
    - Bytespider           # known to partially ignore robots.txt
  search:          # retrieval crawlers: build live search indexes; most critical for being cited
    - OAI-SearchBot
    - Claude-SearchBot
    - PerplexityBot
    - DuckAssistBot
  user_fetch:      # user fetch: real-time fetching when a link is opened in a conversation (some don't fully respect robots.txt)
    - ChatGPT-User
    - Claude-User
    - Perplexity-User
    - Meta-ExternalFetcher
policy: allow      # allow all (customer-acquisition site)

# ── Vetted but not included ────────────────────────────────────────────────
# GoogleOther — Google's official docs state "generic crawler, **no specific product impact**":
#   blocking it costs no product. Aggregator articles list it as a tier-2 recommended allow, conflicting with the vendor docs; the vendor wins — not included.
#   (GoogleOther-Image / -Video / Google-CloudVertexBot / Storebot-Google likewise: no relevant product surface.)
# YouBot · iaskspider · Diffbot · omgilibot · img2dataset — long-tail AI search and data aggregators.
#   policy is allow, so missing one costs ~0 (a UA not in the roster wouldn't be specifically blocked anyway);
#   while each addition is one more entry to keep maintained against vendor docs. The return doesn't add up — not included.
#
# ── Pending review (leads exist, no official doc confirmation yet; merge after confirming) ──────────────
# FacebookBot (Meta, distinct from Meta-ExternalAgent) · anthropic-ai (Anthropic's legacy UA) · cohere-ai
